name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Build & Lint ────────────────────────────────────────────────────
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Validate repository structure
        working-directory: .
        run: |
          test -f AGENTS.md
          test -f README.md
          test -d docs
          echo "Repository structure is valid."

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile (production)
        run: npm run compile

      - name: TypeScript compile (tests)
        run: npx tsc -p tsconfig.test.json --noEmit

      - name: TypeScript type-check (E2E)
        run: npx tsc -p tsconfig.e2e.json --noEmit

      - name: Lint
        run: npm run lint

  # ── Job 2: Unit Tests ──────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit -- --ci --forceExit --reporters=default

      - name: Upload unit test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: vscode-extension/coverage/
          retention-days: 30

  # ── Job 3: Integration Tests ───────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration -- --ci --forceExit --reporters=default

      - name: Upload integration test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-coverage
          path: vscode-extension/coverage/
          retention-days: 30

  # ── Job 4: E2E Tests ───────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Xvfb (virtual display for VS Code)
        run: sudo apt-get install -y xvfb

      - name: Compile extension and E2E tests
        run: npm run compile && npm run compile:e2e

      - name: Run E2E tests
        run: xvfb-run -a npm run test:e2e
        env:
          VSCODE_TEST_WORKSPACE: ${{ github.workspace }}

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: vscode-extension/.vscode-test/
          retention-days: 14

  # ── Job 5: Coverage Report ─────────────────────────────────────────────────
  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate combined coverage report
        run: npm run test:coverage -- --ci --forceExit

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            vscode-extension/coverage/lcov.info
            vscode-extension/coverage/coverage-summary.json
            vscode-extension/coverage/html/
          retention-days: 30

      - name: Coverage gate check (≥80% lines)
        run: |
          node -e "
            const summary = require('./coverage/coverage-summary.json');
            const total = summary.total;
            const lines = total.lines.pct;
            if (lines < 80) {
              console.error('Coverage ' + lines + '% is below the 80% threshold');
              process.exit(1);
            }
            console.log('Coverage gate passed: ' + lines + '% line coverage');
          "

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = JSON.parse(
              fs.readFileSync('vscode-extension/coverage/coverage-summary.json', 'utf8')
            );
            const t = summary.total;
            const badge = (pct) => pct >= 80 ? '✅' : '❌';
            const body = [
              '## 📊 Coverage Report',
              '',
              '| Metric | Coverage | Status |',
              '|--------|----------|--------|',
              `| Lines | ${t.lines.pct}% (${t.lines.covered}/${t.lines.total}) | ${badge(t.lines.pct)} |`,
              `| Branches | ${t.branches.pct}% (${t.branches.covered}/${t.branches.total}) | ${badge(t.branches.pct)} |`,
              `| Functions | ${t.functions.pct}% (${t.functions.covered}/${t.functions.total}) | ${badge(t.functions.pct)} |`,
              `| Statements | ${t.statements.pct}% (${t.statements.covered}/${t.statements.total}) | ${badge(t.statements.pct)} |`,
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
